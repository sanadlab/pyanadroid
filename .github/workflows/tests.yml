name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # the unit tests do not use the SDK, but the builders need the variable
      ANDROID_HOME: /tmp/android-sdk
    steps:
    - uses: actions/checkout@v4
      with:
        # the package imports code from the reran submodule
        submodules: true
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest
    - name: Run unit tests
      run: python -m pytest anadroid/test/unit
